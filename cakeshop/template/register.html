 <style>

        }

        .login-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 20px;
            background-color:white;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);

        .login-container h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid orange;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color:orange;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color:orange;
        }

        .login-container a {
            color:orange;
        }

        .login-container a:hover {
            color: orange;
        }

        /* Additional styles for the sign-up section */

            text-align: center;

        }

            color:orange;
        }

<body>
    <!-- Topbar Start -->
    <div class="container-fluid px-0 d-none d-lg-block">

            <div class="navbar-nav ms-auto mx-lg-auto py-0">

    <div class="container">
        <div class="alert alert-success alert-dismissible">
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  <strong>User already existed</strong>
</div>
      </div>

        <div class="login-container">
            <h1>SIGNUP</h1>
            <form action="" method="POST">
                {% csrf_token %}
                <div>
                    <input type="text"  placeholder="username" name="username" required="required" data-validation-required-message="Please enter your name"/>
                    <p class="help-block text-danger"></p>
                </div>
                <div>
                    <input type="text"  placeholder="phone" name="phone" required="required" data-validation-required-message="Please enter your phnno" pattern="[0-9]{10,10}" title="A valid phone number contains 10 digits"/>
                </div>
                 <div>
                    <input type="text"  placeholder="email" name="email" required="required" data-validation-required-message="Please enter a validemail"/>
                </div>

                <div>
                    <input type="password"  placeholder="password" name="password" required="required" data-validation-required-message="Please enter a password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"/>
                </div>

                <div>
                    <input type="password"  placeholder="confirmpassword" name="cpass" required="required" data-validation-required-message="field are not match"/>
                </div>


                <div>
                    <button class="btn btn-primary py-3 px-5" type="submit" >Register</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
