    <style>
/* Center form over hero */
.hero {
  position: relative;
}

.contact {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  z-index: 10;
}

/* Form box */
.form-box {
  background: #ffffff;
  width: 100%;
  max-width: 500px;
}

/* Fix dark input issue */
.custom-input {
  background-color: #fff !important;
  color: #000 !important;
  border: 1px solid #ccc;
}

/* Input focus style */
.custom-input:focus {
  border-color: #0d6efd;
  box-shadow: none;
}

/* Button style */
.btn-primary {
  padding: 10px;
  font-weight: 500;
}

    background-color: #f2f2f2; /* light grey */
  }
        /* SAME HERO STYLE AS YOUR CARD PAGE */
.hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

.hero img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  top: 0;
  left: 0;
  z-index: 1;
}

/* CENTER CARD LIKE YOUR PROJECT CARDS */
.form-container {
  position: absolute;
  top: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 400px;
  z-index: 10;
}

/* CARD STYLE SAME AS PROJECT CARD */
.progress-card {
  border-radius: 15px;
  background: #fff;
  padding: 25px;
  box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
}

/* INPUT + BUTTON */
input[type="range"] {
  width: 100%;
}

button {
  width: 100%;
  margin-top: 10px;
}

  top: 0;
  left: 0;

  z-index: 2;
}
