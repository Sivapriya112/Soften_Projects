    <style>
/* =======================================================
   HERO SECTION
======================================================= */

.hero {
  position: relative;

  min-height: 100vh;

  padding-top: 140px;
  padding-bottom: 80px;

  overflow: hidden;
}

/* =======================================================
   CONTACT WRAPPER
======================================================= */

.contact {
  position: relative;

  z-index: 10;

  width: 100%;
}

/* =======================================================
   MAIN LARGE GLASS CONTAINER
======================================================= */

.main-project-box {

  width: 100%;

  padding: 50px;

  border-radius: 32px;

  background: rgba(255,255,255,0.10);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid rgba(255,255,255,0.14);

  box-shadow:
      0 10px 40px rgba(0,0,0,0.35);

  transition: 0.4s ease;
}

.main-project-box:hover {

  box-shadow:
      0 14px 50px rgba(0,0,0,0.45);
}

/* =======================================================
   SECTION TITLE
======================================================= */

.main-project-box h2 {

  font-size: 42px;

  font-weight: 700;

  letter-spacing: 1px;

  margin-bottom: 40px;
}

/* =======================================================
   INPUTS
======================================================= */

.custom-input {

  background: rgba(255,255,255,0.95) !important;

  color: #000 !important;

  border: none;

  height: 52px;

  border-radius: 14px;

  padding-left: 16px;

  font-size: 15px;

  transition: 0.3s ease;
}

/* INPUT PLACEHOLDER */

.custom-input::placeholder {

  color: #777;
}

/* INPUT FOCUS */

.custom-input:focus {

  box-shadow: none !important;

  border: 2px solid #3b82f6;

  background: #fff !important;
}

/* =======================================================
   SEARCH BUTTON
======================================================= */

.btn-primary {

  height: 52px;

  border-radius: 14px;

  font-size: 15px;

  font-weight: 600;

  transition: 0.3s ease;
}

.btn-primary:hover {

  transform: translateY(-2px);
}

/* =======================================================
   PROJECT GRID
======================================================= */

.project-grid {

  margin-top: 50px;
}

/* =======================================================
   PROJECT CARD
======================================================= */

.project-card {

  height: 100%;

  padding: 28px;

  border-radius: 24px;

  background: rgba(255,255,255,0.12);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.10);

  box-shadow:
      0 6px 24px rgba(0,0,0,0.25);

  transition: 0.4s ease;

  display: flex;

  flex-direction: column;

  justify-content: space-between;

  overflow: hidden;
}

/* CARD HOVER */

.project-card:hover {

  transform: translateY(-10px);

  box-shadow:
      0 16px 40px rgba(0,0,0,0.40);
}

/* =======================================================
   PROJECT TITLE
======================================================= */

.project-title {

  color: #fff;

  font-size: 24px;

  font-weight: 700;

  margin-bottom: 18px;

  line-height: 1.4;
}

/* =======================================================
   PROJECT DESCRIPTION
======================================================= */

.project-description {

  color: rgba(255,255,255,0.82);

  font-size: 15px;

  line-height: 1.9;

  margin-bottom: 24px;

  display: -webkit-box;

  -webkit-line-clamp: 4;

  -webkit-box-orient: vertical;

  overflow: hidden;

  min-height: 110px;
}

/* =======================================================
   FOOTER
======================================================= */

.project-footer {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: auto;
}

/* =======================================================
   BUDGET BADGE
======================================================= */

.budget-box {

  padding: 10px 20px;

  border-radius: 30px;

  background: rgba(59,130,246,0.18);

  border: 1px solid rgba(96,165,250,0.20);

  color: #dbeafe;

  font-size: 14px;

  font-weight: 600;
}

/* =======================================================
   CATEGORY BADGE
======================================================= */

.category-box {

  padding: 8px 18px;

  border-radius: 30px;

  background: rgba(34,197,94,0.16);

  border: 1px solid rgba(34,197,94,0.20);

  color: #bbf7d0;

  font-size: 13px;

  font-weight: 600;
}

/* =======================================================
   TECHNOLOGY TAG
======================================================= */

.tech-box {

  margin-top: 18px;

  display: inline-block;

  padding: 8px 18px;

  border-radius: 30px;

  background: rgba(168,85,247,0.18);

  border: 1px solid rgba(192,132,252,0.18);

  color: #f3e8ff;

  font-size: 13px;

  font-weight: 600;
}

/* =======================================================
   NAVBAR DROPDOWN
======================================================= */

.navmenu .dropdown ul {

  background: rgba(255, 255, 255, 0.08);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 14px;

  box-shadow:
      0 8px 25px rgba(0,0,0,0.35);

  padding: 10px 0;
}

/* DROPDOWN LINKS */

.navmenu .dropdown ul li a {

  color: #fff;

  padding: 12px 20px;

  transition: 0.3s ease;

  background: transparent;
}

/* HOVER EFFECT */

.navmenu .dropdown ul li a:hover {

  background: rgba(255,255,255,0.12);

  color: #60a5fa;

  border-radius: 8px;
}

/* DROPDOWN ICON */

.navmenu .dropdown > a i {

  transition: 0.3s ease;
}

.navmenu .dropdown:hover > a i {

  transform: rotate(180deg);
}

/* =======================================================
   RESPONSIVE
======================================================= */

@media(max-width: 991px){

  .main-project-box {

    padding: 35px;
  }

  .project-title {

    font-size: 22px;
  }

  .main-project-box h2 {

    font-size: 34px;
  }
}

@media(max-width: 767px){

  .hero {

    padding-top: 120px;
  }

  .main-project-box {

  }

  .main-project-box h2 {

    font-size: 28px;
  }

  .project-title {

    font-size: 20px;
  }

  .project-description {

    min-height: auto;
  }

.navmenu .dropdown > a i {

/* Optional hover animation */
.navmenu .dropdown:hover > a i {

<div class="contact">

      <!-- HEADING -->

      <h2 class="text-center text-white mb-5">

        Explore Projects

      </h2>

      <!-- SEARCH FILTERS -->

      <form method="GET">

        <div class="row g-3 justify-content-center">

          <!-- SEARCH -->

          <div class="col-lg-3 col-md-6">

            <input type="text"
                   name="search"
                   class="form-control custom-input"
                   placeholder="Search Projects">

          </div>

          <!-- CATEGORY -->

          <div class="col-lg-2 col-md-6">

            <select name="category"
                    class="form-control custom-input">

              <option value="">Category</option>

              <option value="Web">Web</option>

              <option value="AI">AI</option>

              <option value="Mobile">Mobile</option>

            </select>

          </div>

          <!-- TECHNOLOGY -->

          <div class="col-lg-2 col-md-6">

            <select name="technology"
                    class="form-control custom-input">

              <option value="">Technology</option>

              <option value="Python">Python</option>

              <option value="Django">Django</option>

              <option value="React">React</option>

            </select>

          </div>

          <!-- BUDGET -->

          <div class="col-lg-2 col-md-6">

            <select name="budget"
                    class="form-control custom-input">

              <option value="">Budget</option>

              <option value="5000">Below 10000</option>

              <option value="10000">Below 20000</option>

              <option value="20000">Below 30000</option>

            </select>

          </div>

          <!-- BUTTON -->

          <div class="col-lg-2 col-md-6">

            <button type="submit"
                    class="btn btn-primary w-100">

              Search

            </button>

          </div>

        </div>

      </form>

      <!-- PROJECTS GRID -->

        {% for i in projects %}

        <div class="col-lg-4 col-md-6 mb-4">

            <h4 class="project-title">

              {{ i.title }}

            </h4>

            <!-- DESCRIPTION -->

            <p class="project-description">

              {{ i.description }}

            </p>

            <!-- BOTTOM -->

            <div class="project-footer">

              <span class="budget-box">

                ₹ {{ i.budget }}

              </span>

            </div>

          </div>

        </div>

        {% endfor %}
