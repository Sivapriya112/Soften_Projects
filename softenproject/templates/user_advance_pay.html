   <style>
     /* =========================
   HERO LAYER FIX
========================= */

.hero {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  z-index: 1;
}

/* background image */
.hero img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* dark overlay effect (optional but improves readability) */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1;
}

/* =========================
   PAYMENT WRAPPER (FIXED OVERLAY)
========================= */

.payment-wrapper {
  position: absolute;
  inset: 0;

  display: flex;
  justify-content: center;
  align-items: center;

  padding-top: 80px; /* keeps below navbar */

  z-index: 10; /* IMPORTANT: above hero */
}

/* =========================
   PAYMENT CARD (GLASS UI)
========================= */

.payment-card {
  width: 420px;
  padding: 40px;
  border-radius: 20px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);

  text-align: center;
  color: white;

  position: relative;
  z-index: 11;
}

.payment-card h2 {
  margin-bottom: 12px;
  font-weight: 800;
  font-size: 26px;

  background: linear-gradient(135deg, #00c6ff, #0072ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-align: center;
  letter-spacing: 1px;
}

.payment-card p {
  opacity: 0.8;
  font-size: 14px;
  margin-bottom: 25px;
}

/* =========================
   RAZORPAY BUTTON
========================= */

.razorpay-payment-button {
  width: 100% !important;
  padding: 14px !important;
  border-radius: 50px !important;
  font-size: 16px !important;
  font-weight: 600 !important;

  background: linear-gradient(135deg,#ff6a00,#ee0979,#8e2de2) !important;
  color: white !important;

  border: none !important;
  cursor: pointer;

  transition: 0.3s ease;
}

.razorpay-payment-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(238,9,121,0.4);
}

/* =========================
   FORM STYLES (SAFE FIX)
========================= */

.form-box {
  background: #ffffff;
  width: 100%;
  max-width: 500px;
}

.custom-input {
  background-color: #fff !important;
  color: #000 !important;
  border: 1px solid #ccc;
}

.custom-input:focus {
  border-color: #0d6efd;
  box-shadow: none;
}

/* =========================
   TABLE GLASS UI (UNCHANGED DESIGN)
========================= */

.custom-table {
  width: 100%;
  background: rgba(255, 255, 255, 0.08) !important;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  color: #fff;
}

.custom-table thead th {
  background: linear-gradient(135deg, #a8edea, #fed6e3);
  color: #2c3e50;
  text-align: center;
  padding: 14px;
  font-weight: 600;
  border: none;
}

.custom-table thead th:first-child {
  border-top-left-radius: 12px;
}

.custom-table thead th:last-child {
  border-top-right-radius: 12px;
}

.custom-table tbody td {
  background: rgba(255, 255, 255, 0.05) !important;
  color: rgba(255, 255, 255, 0.9);
  text-align: center;
  padding: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  transition: 0.3s ease;
}

.custom-table tbody tr:hover td {
  background: rgba(255, 255, 255, 0.12) !important;
  transform: scale(1.01);
}

.table-bordered {
  border: none !important;
}
