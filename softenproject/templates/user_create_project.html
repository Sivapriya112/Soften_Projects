    <style>
/* HERO SECTION */
.hero {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
}

/* CENTER FORM */
.contact {
  position: absolute;
  top: 52%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  z-index: 10;
  padding: 20px;
}

/* GLASSMORPHISM FORM BOX */
.form-box {
  width: 100%;
  max-width: 530px;   /* smaller card */

  padding: 28px;      /* reduced padding */

  background: rgba(255, 255, 255, 0.08);

  border: 1px solid rgba(255,255,255,0.18);

  border-radius: 24px;

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  box-shadow:
      0 8px 32px rgba(0,0,0,0.25);

  transition: all 0.3s ease;
}

/* HOVER EFFECT */
.form-box:hover {
  transform: translateY(-4px);

  box-shadow:
      0 12px 40px rgba(0,0,0,0.35);
}

/* FORM TITLE */
.form-box h3 {
  color: #fff;
  font-weight: 700;
  letter-spacing: 1px;
}

/* INPUT FIELDS */
.custom-input {
  background: rgba(255,255,255,0.12) !important;

  border: 1px solid rgba(255,255,255,0.18);

  color: #fff !important;

  height: 50px;

  border-radius: 12px;

  padding-left: 15px;

  transition: 0.3s ease;
}

/* PLACEHOLDER */
.custom-input::placeholder {
  color: rgba(255,255,255,0.75);
}

/* INPUT FOCUS */
.custom-input:focus {
  background: rgba(255,255,255,0.18) !important;

  border-color: #60a5fa;

  box-shadow: 0 0 10px rgba(96,165,250,0.35);

  color: #fff !important;
}

/* DATE INPUT ICON COLOR */
input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1);
  cursor: pointer;
}

/* BUTTON */
.btn-primary {
  height: 50px;

  border: none;

  border-radius: 14px;

  font-weight: 600;

  font-size: 16px;

  background: linear-gradient(135deg, #2563eb, #60a5fa);

  transition: 0.3s ease;
}

/* BUTTON HOVER */
.btn-primary:hover {
  transform: translateY(-2px);

  background: linear-gradient(135deg, #1d4ed8, #3b82f6);

  box-shadow: 0 8px 20px rgba(59,130,246,0.4);
}

/* TRANSPARENT DROPDOWN */
.navmenu .dropdown ul {
  background: rgba(255, 255, 255, 0.08);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 14px;

  box-shadow:
      0 8px 25px rgba(0,0,0,0.35);

  padding: 10px 0;
}

/* DROPDOWN LINKS */
.navmenu .dropdown ul li a {
  color: #fff;

  padding: 12px 20px;

  transition: 0.3s ease;

  background: transparent;
}

/* DROPDOWN HOVER */
.navmenu .dropdown ul li a:hover {
  background: rgba(255,255,255,0.12);

  color: #60a5fa;

  border-radius: 8px;
}

  }

  .form-box {
    padding: 28px;

}

@keyframes gradientMove {

<div class="contact d-flex justify-content-center align-items-center">

  <div class="form-box p-4 shadow rounded">
   <form action="" method="POST">

    {% csrf_token %}

    <h3 class="text-center mb-4">
        Create Project
    </h3>


    <!-- PROJECT TITLE -->

    <div class="mb-3">

        <input type="text"
               name="title"
               class="form-control custom-input"
               placeholder="Project Title"
               required>

    </div>


    <!-- DESCRIPTION -->

    <div class="mb-3">

        <textarea name="description"
                  class="form-control custom-input"
                  placeholder="Project Description"
                  rows="4"
                  required></textarea>

    </div>


    <!-- CATEGORY -->

<div class="mb-3">

    <select name="category"
            id="categorySelect"
            class="form-control custom-input"
            required>

        <option value="">Select Category</option>

        {% for i in categories %}

        <option value="{{ i.id }}">
            {{ i.category_name }}
        </option>

        {% endfor %}

        <option value="other">
            Other
        </option>

    </select>

</div>


<!-- OTHER CATEGORY INPUT -->

<div class="mb-3"
     id="otherCategoryBox"
     style="display:none;">

    <input type="text"
           name="other_category"
           class="form-control custom-input"
           placeholder="Enter New Category">

</div>

    <!-- TECHNOLOGY CHECKBOX -->

   <div class="mb-4">

    <div class="tech-box">

        <h5 class="text-white mb-3">
            Select Technologies
        </h5>

        {% for i in technologies %}

        <div class="form-check mb-2">

            <input class="form-check-input"
                   type="checkbox"
                   name="technology"
                   value="{{ i.id }}"
                   id="tech{{ i.id }}">

            <label class="form-check-label tech-label"
                   for="tech{{ i.id }}">

                {{ i.technology_name }}

            </label>

        </div>

        {% endfor %}


        <!-- OTHER -->

        <div class="form-check mb-2">

            <input class="form-check-input"
                   type="checkbox"
                   id="otherTechCheck">

            <label class="form-check-label tech-label">
                Other
            </label>

        </div>

    </div>




<!-- OTHER TECHNOLOGY INPUT -->

<div class="mb-3"
     id="otherTechBox"
     style="display:none;">

    <input type="text"
           name="other_technology"
           class="form-control custom-input"
           placeholder="Enter New Technology">

</div>



    </div>


    <!-- BUDGET -->

    <div class="mb-3">

        <input type="number"
               name="budget"
               class="form-control custom-input"
               placeholder="Budget"
               required>

    </div>


    <!-- DEADLINE -->

    <div class="mb-4">

        <input type="date"
               name="deadline"
               class="form-control custom-input"
               required>

    </div>


    <!-- SUBMIT BUTTON -->

    <div class="text-center">

        <button type="submit"
                class="btn btn-primary w-100">

            Submit

        </button>

    </div>
       </div>

</form>

<script>

document.getElementById("categorySelect").addEventListener("change", function () {

    if(this.value === "other") {

        document.getElementById("otherCategoryBox").style.display = "block";

    }

    else {

        document.getElementById("otherCategoryBox").style.display = "none";

    }

});



document.getElementById("otherTechCheck").addEventListener("change", function () {

    if(this.checked) {

        document.getElementById("otherTechBox").style.display = "block";

    }

    else {

        document.getElementById("otherTechBox").style.display = "none";

    }

});

</script>
