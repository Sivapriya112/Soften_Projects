<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:#d1d7db;
}

/* MAIN CHAT */
.chat-wrapper{
    width:100%;
    max-width:900px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#efeae2;
}

/* HEADER */
.chat-header{
    background:#075E54;
    color:white;
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-header img{
    width:45px;
    height:45px;
    border-radius:50%;
}

.name{
    font-size:17px;
    font-weight:600;
}

/* CHAT BODY */
.chat-body{
    flex:1;
    overflow-y:auto;
    padding:15px;
    background:#ece5dd;
    display:flex;
    flex-direction:column;
}

/* MESSAGE ROW */
.message-row{
    width:100%;
    display:flex;
    margin-bottom:10px;
}

/* RIGHT MESSAGE */
.sent{
    justify-content:flex-end;
}

/* LEFT MESSAGE */
.received{
    justify-content:flex-start;
}

/* MESSAGE BOX */
.message{
    max-width:70%;
    padding:8px 12px;
    border-radius:10px;
    position:relative;
    font-size:15px;
    line-height:1.5;
    word-break:break-word;
}

/* USER */
.sent .message{
    background:#DCF8C6;
    border-top-right-radius:0;
}

/* DEVELOPER */
.received .message{
    background:white;
    border-top-left-radius:0;
}

/* TIME */
.time{
    font-size:11px;
    color:gray;
    margin-top:5px;
    text-align:right;
}

/* FOOTER */
.chat-footer{
    background:#f0f0f0;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

/* INPUT */
.chat-footer input{
    flex:1;
    padding:12px 15px;
    border:none;
    border-radius:25px;
    outline:none;
    font-size:15px;
}

/* BUTTON */
.chat-footer button{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:#075E54;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.chat-footer button:hover{
    background:#0b806f;
}

/* MOBILE */
@media(max-width:768px){

    .message{
        max-width:85%;
    }

    .chat-wrapper{
        max-width:100%;
    }
}

</style>
</head>

<body>

<div class="chat-wrapper">

    <!-- HEADER -->
    <div class="chat-header">

        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

        <div class="name">
            {{ project.project_title }}
        </div>

    </div>

    <!-- CHAT BODY -->
    <div class="chat-body">

        {% for msg in messages %}

            {% if msg.sender_user %}

                <!-- USER MESSAGE -->
                <div class="message-row sent">

                    <div class="message">

                        {{ msg.message }}

                        <div class="time">
                            {{ msg.timestamp|date:"h:i A" }}
                        </div>

                    </div>

                </div>

            {% elif msg.sender_developer %}

                <!-- DEVELOPER MESSAGE -->
                <div class="message-row received">

                    <div class="message">

                        {{ msg.message }}

                        <div class="time">
                            {{ msg.timestamp|date:"h:i A" }}
                        </div>

                    </div>

                </div>

            {% endif %}

        {% empty %}

            <p style="text-align:center;color:gray;">
                No messages yet
            </p>

        {% endfor %}

    </div>

    <!-- FOOTER -->
    <form method="POST" class="chat-footer">

        {% csrf_token %}

        <input type="text"
               name="message"
               placeholder="Type a message..."
               autocomplete="off"
               required>

        <button type="submit">
            ➤
        </button>

    </form>

</div>

</body>
</html>
