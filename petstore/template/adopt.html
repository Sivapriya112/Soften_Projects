                <h3 class="text-primary text-uppercase">ADOPT</h3>
                <h1 class="display-5 text-uppercase mb-0">Please Fill The Form </h1>
            </div>
            <div class="row g-5">
                <div class="col-lg-7">
                    <form method="POST" action="adopt_req">
                        {% csrf_token %}
                        <div class="row g-3">
                            {% for i in r %}
                            <div class="col-12">
                                <input type="text" class="form-control bg-light border-0 px-4" name="a1"  value="{{i.username}}" placeholder="User Name" style="height: 55px;">
                            </div>
                            <div class="col-12">
                                <input type="text" class="form-control bg-light border-0 px-4" name="a2" value="{{i.name}}" placeholder="Full Name" style="height: 55px;">
                            </div>
                            <div class="col-12">
                                <input type="email" class="form-control bg-light border-0 px-4" name="a3" value="{{i.email}}" placeholder="Your Email" style="height: 55px;">
                            </div>
                            <div class="col-12">
                                <input type="text" class="form-control bg-light border-0 px-4" name="a4"  value="{{i.mob}}" placeholder="Phone Number" style="height: 55px;">
                            </div>
                            {% endfor %}
                            <div class="col-12">
                                <textarea class="form-control bg-light border-0 px-4 py-3" rows="4" name="a5" placeholder="Message"></textarea>
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary w-100 py-3" type="submit" onclick="return confirm('Are You Sure')">Send Message</button>
                            </div>
                        </div>
                    </form>
