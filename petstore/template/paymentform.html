<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="utf-8">
    <title>PET SHOP - Pet Shop Website Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'lib/flaticon/font/flaticon.css' %}" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
    l{
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    color: grey;
    text-transform: uppercase;
    font-size: 18px;
    letter-spacing: 2px;
    padding-left: 10px;
    }
    </style>
</head>

<body>

    <!-- Navbar Start -->

    <!-- Navbar End -->


     <div class="col-lg-4">
         <form action="paymentform" method="post" enctype="multipart/form-data" >
             {% csrf_token %}
                    <div class="bg-light text-center pt-5 mt-lg-5">
                        <h2 class="text-primary text-uppercase" align="center">PLACE ORDER</h2>
                        <div class="text-center p-4">
                            {% for i in r %}
<!--                            <div class="d-flex align-items-center justify-content-between mb-1">-->
                            <l>USER NAME</l>
                            <br>
                                <span><input type="text"  value="{{i.user_details.username}}"></span>
<!--                                <i class="bi bi-check2 fs-4 text-primary"></i>-->
<!--                            </div>-->
                            <br>
                            <br>
                            <l>PHONE NUMBER</l>
                            <br>
<!--                            <div class="d-flex align-items-center justify-content-between mb-1">-->
                                <span><input type="text" placeholder="MOB" value="{{i.user_details.mob}}"></span>
<!--                                <i class="bi bi-check2 fs-4 text-primary"></i>-->
<!--                            </div>-->
                            <br>
                            <br>
                            <l>EMAIL</l>
                            <br>
<!--                            <div class="d-flex align-items-center justify-content-between mb-1">-->
                                <span><input type="text" placeholder="EMAIL" value="{{i.user_details.email}}"></span>
<!--                                <i class="bi bi-check2 fs-4 text-primary"></i>-->
<!--                            </div>-->
                            <br>
                            <br>
                            <l>NAME</l>
                            <br>
<!--                            <div class="d-flex align-items-center justify-content-between mb-1">-->
                                <span><input type="text" placeholder="NAME" value="{{i.user_details.name}}"></span>
<!--                                <i class="bi bi-check2 fs-4 text-primary"></i>-->
<!--                            </div>-->
                            <br>
                            <br>
                            <l>ADDRESS</l>
                            <br>
<!--                            <div class="d-flex align-items-center justify-content-between mb-1">-->
                                <span><input type="text" placeholder="ADDRESS" value="{{i.user_details.address}}"></span>
<!--                                <i class="bi bi-check2 fs-4 text-primary"></i>-->
<!--                            </div>-->
                            <br>
                            <br>
                            <l>TOTAL AMOUNT</l>
                            <br>
<!--                            <div class="d-flex align-items-center justify-content-between mb-1">-->
                                <span><input type="text" placeholder="AMOUNT" value="{{i.total_price}}"></span>
<!--                                <i class="bi bi-check2 fs-4 text-primary"></i>-->
<!--                            </div>-->
                            <br>
                            <br>
                            {% endfor %}
                           
                            <button type="submit" class="btn btn-primary text-uppercase py-2 px-4 my-3" >PAY</button>
<!--                            <a href="adopt" class="btn btn-primary text-uppercase py-2 px-4 my-3">Adopt</a>-->
                            <br>
                             <a href="cart">BACK</a>
                        </div>

                    </div>
         </form>
     </div>


    <!-- Back to Top -->
    <a href="#" class="btn btn-primary py-3 fs-4 back-to-top"><i class="bi bi-arrow-up"></i></a>


    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>

    <!-- Template Javascript -->
    <script src="{% static 'js/main.js'  %}"></script>
</body>

</html>
