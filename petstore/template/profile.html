 <!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta charset="utf-8">
    <title>PET SHOP - Pet Shop Website Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'lib/flaticon/font/flaticon.css' %}" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
       <style>
    .login{
    align: center;
    border: 1 px solid black;
    width: 400px;
    height: 625px;
    background: pink;
    color: white;
    border-radius: 20px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.75);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    margin-left: 25px;
    }
    form{
    display: block;
    box-sizing: border-box;
    padding: 40px;
    width: 100%;
    height: 100%;
    backdrop-filter: brightness(40%);
    flex-direction: column;
    display: flex;
    gap: 5px;
    }
    h{
    font-weight: normal;
    font-size: 24px;
    text-align: center;
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    margin-bottom: 50px;
    }
    b{
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    font-size: 12px;
    text-align: center;
    letter-spacing: 2px;
    margin-top: 15px;
    }
    label{
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    font-size: 15px;
    letter-spacing: 2px;
    padding-left: 10px;
    }
    p{
    background:rgba(255, 255, 255, 0.3);
    height: 40px;
    line-height: 40px;
    border-radius: 20px;
    padding: 0px 20px;
    border: none;
    margin-bottom: 20px;
    color: white;
    }
    input{
    background:rgb(45, 126,231);
    height: 40px;
    line-height: 40px;
    border-radius: 20px;
    padding: 0px 20px;
    border: none;
    margin-bottom: 20px;
    color: white;
    }
    button{
    background:rgb(45, 126,231);
    height: 40px;
    line-height: 40px;
    border-radius: 40px;
    text-align: center;
    border: none;
    margin: 10px 0px;
    box-shadow: 0px 0px 5px rgba(0,0,0,0.3);
    color: white;
    }
  </style>
</head>
<body background="{% static 'img/cat2.jpg'%}" style="background-size:cover;">
<!-- Navbar Start-->
  <nav class="navbar navbar-expand-lg bg-white navbar-light shadow-sm py-3 py-lg-0 px-3 px-lg-0">
<!--        <a href="index.html" class="navbar-brand ms-lg-5">-->
      <a class="text-primary text-uppercase ms-lg-2" href="userindex"><i class="bi bi-arrow-left"></i></a>
<!--      <a href="userindex" class="nav-item nav-link nav-contact bg-primary text-white px-5 ms-lg-5"><i class="bi bi-arrow-left"></i></a>-->
      <h1 class="m-0 ms-lg-5 text-uppercase text-dark"><i class="bi bi-shop fs-1 text-primary me-3"></i>Pet Shop</h1>
<!--      </a>-->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
          <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
          <div class="navbar-nav ms-auto py-0">
              <a href="profile" class="nav-item nav-link active">Profile</a>
              <a href="myorder" class="nav-item nav-link">My order</a>
              <a href="userserviceview" class="nav-item nav-link">View appoinment</a>
              <a href="useradoptview" class="nav-item nav-link">View adopt request</a>
              <a href="contact" class="nav-item nav-link">Help</a>
              <a href="logout" class="nav-item nav-link">logout</a>
              <a href="#" class="nav-item nav-link active"></a>
          </div>
      </div>
  </nav>
<!--     Navbar End-->

<div class="container-fluid pt-5">
        <div class="container">
            <div class="border-start border-5 border-primary ps-5 mb-5" style="max-width: 600px;">
                <h6 class="display-5 text-primary text-uppercase">USER PROFILE</h6>
<!--                <h1 class="display-5 text-uppercase mb-0">Please Feel Free To Contact Us</h1>-->
            </div>
        </div>
<!--<div class="container-fluid bg-offer my-0 py-1">-->
<!--        <div class="container py-3">-->
            <div class="row gx-5 justify-content-start">
                <div class="col-lg-7">
                    <div class="ps-5 mb-5">
                        <div class="login">
                            <form>
                                {% csrf_token %}
                                {% for i in r %}

                                <label>name</label>
                                <p>{{i.name}}</p>

                                <label>phone number</label>
                                <p>{{i.mob}}</p>

                                <label>email</label>
                                <p>{{i.email}}</p>

                                <label>address</label>
                                <p>{{i.address}}</p>

                                <label>username</label>
                                <p>{{i.username}}</p>

                                {% endfor %}

                                <button><a href="update_prof">EDIT</a></button>
                                <b><a href="change">CHANGE PASSWORD</a></b>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
</div>
</body>
</html>
