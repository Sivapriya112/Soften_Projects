<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <title>PET SHOP - Pet Shop Website Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <script type="application/x-javascript"> addEventListener("load", function() { setTimeout(hideURLbar, 0); }, false);function hideURLbar(){ window.scrollTo(0,1); } </script>

	<link href="{% static 'register/css/style2lab.css' %}" rel="stylesheet"  type='text/css' media="all">
	<link href="{% static 'register/css/font-awesome.min.css' %}" rel='stylesheet' type='text/css' media="all" >

    <link href='//fonts.googleapis.com/css?family=Lato:400,100,100italic,300,300italic,400italic,700,700italic,900,900italic' rel='stylesheet' type='text/css'><link href='//fonts.googleapis.com/css?family=Raleway+Dots' rel='stylesheet' type='text/css'>
    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'lib/flaticon/font/flaticon.css' %}" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg bg-white navbar-light shadow-sm py-3 py-lg-0 px-3 px-lg-0">
    <a href="index.html" class="navbar-brand ms-lg-5">
        <h1 class="m-2 text-uppercase text-dark"><i class="bi bi-shop fs-1 text-primary me-3"></i>Pet Shop</h1>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>
<!-- Navbar End -->

<div class="main-agileits">
	<h2 class="sub-head">User Sign Up</h2>
		<div class="sub-main">
			<form action="user.html" method="POST">
                {% csrf_token %}
				<input placeholder="Name" name="u1" class="name" type="text" required="">
				<input type="text" placeholder="Phone Number" name="u2" class="number2" pattern="[0-9]{10}" required="">
				<input placeholder="Email" name="u3" class="mail" type="text" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"  required="">
				<input  placeholder="Username" name="u4" class="username" type="text" required="">
				<input  placeholder="Password"  name="u5" class="pass" type="password" pattern="(?=.\d)(?=.[a-z])(?=.*[A-Z]).{8,}" required="">
				<input type="submit" value="signup" class="btn btn-defeault btn-send"  onclick="return confirm('Are You Sure')">
			</form>
		</div>
		<div class="clear"></div>
</div>
<a href="/" class="">&laquo; Back</a>
<script>
<!--                   -->
            </script>
</body>
</html>
