<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <style>
    .login{
    align: center;
    border: 1 px solid black;
    width: 400px;
    height: 600px;
    background: black;
    color: white;
    border-radius: 20px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.75);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    margin-left: 30px;
    }
    form{
    display: block;
    box-sizing: border-box;
    padding: 40px;
    width: 100%;
    height: 100%;
    backdrop-filter: brightness(40%);
    flex-direction: column;
    display: flex;
    gap: 5px;
    }
    h{
    font-weight: normal;
    font-size: 24px;
    text-align: center;
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    margin-bottom: 25px;
    }
    a{
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    font-size: 12px;
    text-align: center;
    letter-spacing: 2px;
    margin-top: 30px;
    }
    label{
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 2px;
    padding-left: 10px;
    }
    input{
    background:rgba(255, 255, 255, 0.3);
    height: 40px;
    line-height: 40px;
    border-radius: 20px;
    padding: 0px 20px;
    border: none;
    margin-bottom: 20px;
    color: white;
    }
    sub{
    background:rgb(45, 126,231);
    height: 40px;
    line-height: 40px;
    border-radius: 40px;
    text-align: center;
    border: none;
    margin: 10px 0px;
    box-shadow: 0px 0px 5px rgba(0,0,0,0.3);
    color: white;
    }
    l{
    text-shadow: 0px 0px 2px rgba(0,0,0,0.5);
    color: red;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 2px;
    padding-left: 10px;
    }
  </style>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta charset="utf-8">
    <title>PET SHOP - Pet Shop Website Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&family=Roboto:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'lib/flaticon/font/flaticon.css' %}" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white navbar-light shadow-sm py-3 py-lg-0 px-3 px-lg-0">
        <a href="index.html" class="navbar-brand ms-lg-5">
            <h1 class="m-0 text-uppercase text-dark"><i class="bi bi-shop fs-1 text-primary me-3"></i>Pet Shop</h1>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>
    <!-- Navbar End -->
<!-- Offer Start -->
    <div class="container-fluid bg-offer my-0 py-5">
        <div class="container py-3">
            <div class="row gx-5 justify-content-start">
                <div class="col-lg-7">
                    <div class="ps-5 mb-5">
                        <div class="login">
                            <form method="POST" action="signup.html">
                                {% csrf_token %}
                                <h>SIGN UP</h>
                                <label>name</label>
                                <input type="text" name="n1" required="">
                                <label>phone number</label>
                                <input type="text"  name="n2" pattern="[0-9]{10}" required="">
                                <label>email</label>
                                <input type="email" name="n3" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"  required="">
                                <label>username</label>
                                <input type="text" name="n4"  required="">
                                <label>address</label>
                                <input type="text" name="n6"  required="">
                                <label>password</label>
                                <input type="password" name="n5" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"  required="">
                                {% for i in messages %}
                                        <l>{{i}}</l>
                                {% endfor %}
                                <sub><input type="submit"></sub>
                                <a href="login">Back</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
<!--						-->
								}
				  </script>
    <!-- Offer End -->

</body>
</html>
